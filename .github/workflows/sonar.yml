name: Analisis estatico

defaults:
  run:
    working-directory: tp-ahorcado

on:
  push:
  pull_request:

jobs:
  analisis:
    name: Analisis estatico y quality gate
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tp-ahorcado/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar navegadores de Playwright
        run: npx playwright install --with-deps

      - name: Ejecutar acceptance tests
        run: npm run at

      - name: Ejecutar tests con cobertura
        run: npm run test:coverage

      - name: Compilar aplicacion
        run: npm run build

      - name: Analizar codigo
        uses: SonarSource/sonarqube-scan-action@v6
        with:
          projectBaseDir: tp-ahorcado
        env:
          SONAR_TOKEN: ${{ secrets.SONARQUBE_KEY }}

      - name: Verificar quality gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        with:
          scanMetadataReportFile: tp-ahorcado/.scannerwork/report-task.txt
          pollingTimeoutSec: 300
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONARQUBE_KEY }}

      - name: Preparar artefacto de GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: tp-ahorcado/dist

  deploy:
    name: Desplegar en GitHub Pages
    needs: analisis
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
