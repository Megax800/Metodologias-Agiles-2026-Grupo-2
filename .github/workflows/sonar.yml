name: Analisis estatico

defaults:
  run:
    working-directory: tp-ahorcado

on:
  push:
  pull_request:

jobs:
  analisis:
    name: Analisis estatico y quality gate
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tp-ahorcado/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar aplicacion
        run: npm run build

      - name: Analizar codigo
        uses: SonarSource/sonarqube-scan-action@v6
        with:
          projectBaseDir: tp-ahorcado
          args: >
            -Dsonar.verbose=true
        env:
          SONAR_TOKEN: ${{ secrets.SONARQUBE_KEY }}

      - name: Buscar archivos de Sonar
        if: always()
        working-directory: .
        run: |
          echo "Workspace:"
          pwd
          echo "Archivos de metadatos:"
          find . -name "report-task.txt" -o -name "report-task.properties"
          echo "Directorios scanner:"
          find . -type d -name ".scannerwork"

      #- name: Analizar codigo
      #  uses: SonarSource/sonarqube-scan-action@v6
      #  with:
      #    projectBaseDir: tp-ahorcado
      #  env:
      #    SONAR_TOKEN: ${{ secrets.SONARQUBE_KEY }}

      - name: Verificar archivo de metadatos
        if: always()
        run: |
          ls -la .scannerwork/
          test -f .scannerwork/report-task.txt

      - name: Verificar quality gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        with:
          scanMetadataReportFile: tp-ahorcado/.scannerwork/report-task.txt
          pollingTimeoutSec: 300
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONARQUBE_KEY }}
